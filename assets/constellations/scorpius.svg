<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Scorpius constellation line art -->
  <g stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <!-- Head/claws -->
    <line x1="15" y1="25" x2="25" y2="35"/>
    <line x1="25" y1="35" x2="20" y2="45"/>
    <line x1="20" y1="45" x2="30" y2="42"/>
    <!-- Body -->
    <line x1="30" y1="42" x2="40" y2="38"/>
    <line x1="40" y1="38" x2="50" y2="45"/>
    <line x1="50" y1="45" x2="60" y2="55"/>
    <!-- Tail curl -->
    <line x1="60" y1="55" x2="72" y2="68"/>
    <line x1="72" y1="68" x2="85" y2="72"/>
    <line x1="85" y1="72" x2="88" y2="65"/>
  </g>
  <g fill="#FFD700">
    <circle cx="15" cy="25" r="2.5"/>
    <circle cx="25" cy="35" r="2.5"/>
    <circle cx="20" cy="45" r="2.5"/>
    <circle cx="30" cy="42" r="2.5"/>
    <circle cx="40" cy="38" r="4" fill="#FF6347"><animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/></circle><!-- Antares (red) -->
    <circle cx="50" cy="45" r="2.5"/>
    <circle cx="60" cy="55" r="2.5"/>
    <circle cx="72" cy="68" r="2.5"/>
    <circle cx="85" cy="72" r="3"><animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="65" r="2.5"/>
  </g>
</svg>
