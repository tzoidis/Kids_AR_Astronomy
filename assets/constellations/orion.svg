<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Orion constellation line art -->
  <!-- Lines -->
  <g stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="30" y1="20" x2="70" y2="20"/><!-- shoulders -->
    <line x1="30" y1="20" x2="45" y2="50"/><!-- left to belt -->
    <line x1="70" y1="20" x2="55" y2="45"/><!-- right to belt -->
    <line x1="40" y1="47" x2="50" y2="48"/><!-- belt -->
    <line x1="50" y1="48" x2="58" y2="50"/><!-- belt -->
    <line x1="45" y1="50" x2="30" y2="85"/><!-- left leg -->
    <line x1="55" y1="45" x2="72" y2="80"/><!-- right leg -->
    <line x1="30" y1="85" x2="72" y2="80"/><!-- base -->
  </g>
  <!-- Stars -->
  <g fill="#FFD700">
    <circle cx="30" cy="20" r="4"><animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="20" r="3"/>
    <circle cx="40" cy="47" r="2.5"/>
    <circle cx="50" cy="48" r="2.5"/>
    <circle cx="58" cy="50" r="2.5"/>
    <circle cx="72" cy="80" r="3.5"><animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="85" r="2.5"/>
  </g>
</svg>
