<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ursa Major / Big Dipper line art -->
  <!-- Lines -->
  <g stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <!-- Bowl -->
    <line x1="20" y1="35" x2="20" y2="60"/>
    <line x1="20" y1="60" x2="42" y2="62"/>
    <line x1="42" y1="62" x2="45" y2="38"/>
    <line x1="45" y1="38" x2="20" y2="35"/>
    <!-- Handle -->
    <line x1="45" y1="38" x2="58" y2="42"/>
    <line x1="58" y1="42" x2="72" y2="38"/>
    <line x1="72" y1="38" x2="88" y2="30"/>
  </g>
  <!-- Stars -->
  <g fill="#FFD700">
    <circle cx="20" cy="35" r="3.5"><animate attributeName="opacity" values="1;0.6;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="60" r="3"/>
    <circle cx="42" cy="62" r="3"/>
    <circle cx="45" cy="38" r="2.5"/>
    <circle cx="58" cy="42" r="3.5"/>
    <circle cx="72" cy="38" r="3"/>
    <circle cx="88" cy="30" r="3"><animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
